name: publication — protocole Rafale

# tools/rafale.patch.gz est l'archive gzip du correctif README. On la restaure,
# on l'applique, on régénère les parties, puis on supprime tout : ce workflow
# ne sert qu'une fois.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restaurer et appliquer le correctif
        run: |
          gunzip -c tools/rafale.patch.gz > tools/rafale.patch
          git apply --verbose tools/rafale.patch

      - name: Régénérer les parties
        run: node tools/build.js

      - name: Committer et retirer les fichiers ponctuels
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q .github/workflows/apply-rafale-doc.yml
          git add -A README.md src mod tools .github/workflows
          git commit -m 'docs : protocole de mesure sur le Rafale et temps de chargement'
          git push
